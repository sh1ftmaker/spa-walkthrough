<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0b0a">
<title>Kazan-yu walkaround</title>
  <script type="module" crossorigin src="./assets/index-wC5Xc1rp.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-Da3OrDm0.css">
</head>
<body>
<canvas id="kz-canvas"></canvas>
<div id="kz-labels" aria-hidden="true"></div>
<div id="kz-pins"></div>
<div id="kz-joy" aria-hidden="true"><div class="knob"></div></div>
<div id="kz-hud" hidden></div>
<div id="kz-ui">
  <div class="kz-top">
    <div class="kz-where"><span id="kz-where-level"></span><span id="kz-where-space"></span></div>
    <div class="kz-buttons">
      <button id="kz-btn-places" type="button" aria-label="Places">Places</button>
      <button id="kz-btn-mode" type="button" aria-label="Dollhouse view">Dollhouse</button>
      <button id="kz-btn-settings" type="button" aria-label="Settings">&#9881;</button>
    </div>
  </div>
  <div id="kz-levels" hidden></div>
  <div id="kz-hint" hidden></div>
</div>
<div id="kz-sheet" hidden>
  <div class="kz-sheet-head"><h2 id="kz-sheet-title">Places</h2><button id="kz-sheet-close" type="button" aria-label="Close">&times;</button></div>
  <div id="kz-sheet-body"></div>
</div>
<div id="kz-loading">
  <div class="kz-load-title">火山湯 Kazan-yu</div>
  <div class="kz-load-bar"><div id="kz-load-fill"></div></div>
  <div id="kz-load-text">Loading</div>
</div>
<div id="kz-error" hidden></div>
</body>
</html>
