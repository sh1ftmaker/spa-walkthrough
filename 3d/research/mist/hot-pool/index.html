<title>Steam pool</title>
<script type="importmap">{"imports":{"three":"../../../../web/node_modules/three/build/three.module.js","three/addons/":"../../../../web/node_modules/three/examples/jsm/"}}</script>

<body>
<script type="module">
// Prototype (b): a 45/55 °C grotto pool (b1_grotto, concept 16) with fumarole vents on the rim that burst
// every few seconds. Evaporation follows the water temperature (Magnus excess vapour pressure), heat makes the
// layer taller and lifts mist out of it, and a draft through the east arch drags the steam out of the room.
import * as THREE from 'three';
import { createApp, rockMaterial, emissiveMaterial, waterMaterial, lumpify, bakeVertexLight, mulberry, params } from '../common.js';
import { MistZone } from '../mist.js';

const WY = 0;                                   // water surface
const poolR = (th) => 5.2 + 0.7 * Math.sin(2 * th + 0.4) + 0.35 * Math.sin(5 * th + 1.1);
const inPool = (x, z) => Math.hypot(x / 1.15, z) < poolR(Math.atan2(z, x / 1.15));
const caveR = (th) => 7.4 + 0.5 * Math.sin(3 * th + 2.0) + 0.3 * Math.sin(7 * th);
const PORTAL = { x: 8.0, z: 0.4, w: 2.8 };      // east arch to the corridor (draft goes out here)
const INLET = { x: -8.0, z: 2.2, w: 2.2 };      // west passage: cooler air comes in
const inCave = (x, z) => Math.hypot(x, z) < caveR(Math.atan2(z, x)) || (x > 5 && Math.abs(z - PORTAL.z) < PORTAL.w / 2) || (x < -5 && Math.abs(z - INLET.z) < INLET.w / 2);
const HOT = { x: -1.8, z: -1.0, r: 2.2 };       // 55 °C upwelling in the 45 °C pool
const VENTS = [[3.6, -4.3], [-4.9, 3.9], [-5.8, -2.6], [5.6, 3.6]];

const WARM = [1.0, 0.52, 0.22];
const lights = [   // ordered by importance: Low lights the mist with the first 3 only
  { pos: [4.2, 0.9, -5.6], i: 1.2, color: WARM, falloff: 1.2 },
  { pos: [-1.8, -0.4, -1.0], i: 0.5, color: [0.2, 0.9, 0.8], falloff: 0.4 }, // teal pool light
  { pos: [-6.1, 0.9, 1.0], i: 1.2, color: WARM, falloff: 1.2 },
  { pos: [1.0, 0.9, 6.0], i: 1.0, color: WARM, falloff: 1.2 },
  { pos: [6.2, 1.1, 2.4], i: 0.9, color: WARM, falloff: 1.2 },
  { pos: [0, 6.0, -2], i: 1.0, color: [1.0, 0.72, 0.42], falloff: 0.25 },   // shaft of light from the ceiling vent
];

const zone = new MistZone({
  rect: [-8, -8, 8, 8], y: WY, H0: 0.4, Hmax: 1.6, sigma: 2.4,
  tiers: { low: { h: 0.25, hz: 20, iters: 12 }, high: { h: 0.125, hz: 30, iters: 16 } },
  solid: (x, z) => !inCave(x, z),
  temp: (x, z) => inPool(x, z) ? (Math.hypot(x - HOT.x, z - HOT.z) < HOT.r ? 55 : 45) : 0,
  open: { xmax: true, xmin: true },
  wind: (x, z) => { // a draft that leaves through the arch: strongest in front of it
    const dx = PORTAL.x - x, dz = PORTAL.z - z, d = Math.hypot(dx, dz); const s = 0.06 + 0.45 * Math.exp(-d / 3.5);
    return [dx / d * s, dz / d * s];
  },
  params: { srcScale: 0.28, decay: 0.07, dryDecay: 0.5, rise: 0.35, slump: 0.08, vort: 7, drag: 0.4, heatScale: 0.5, heatDecay: 0.45, vorticles: 14, vortV: 0.45 },
  prewarm: 12, look: { detail: 0.9, scale: 0.36, period: 1.8, haze: 0.03 },
  amb: [0.02, 0.019, 0.018], glow: [0.004, 0.02, 0.018], haze: [0.012, 0.009, 0.007],
  lights,
});

const app = createApp({
  title: 'Steam grotto pool · 45/55 °C', zone,
  cams: [
    { pos: [-6.5, 1.5, 5.8], target: [2.5, 0.5, -1.2], fov: 60 },
    { pos: [3.8, 1.3, 5.5], target: [7.6, 0.8, 0.4], fov: 60 },        // toward the arch: steam drawn out
    { pos: [0, 9, 6], target: [0, 0, -0.5], fov: 55 },                  // overview
    { pos: [-3, 0.9, -6.2], target: [-4.9, 0.6, 3.9], fov: 58 },        // across the pool to a vent
  ],
});
const { scene } = app;

// ---- cave shell: lumpy dome whose plan follows caveR, plus the two passages
{
  const NT = 160, NV = 26; const pos = [], idx = [];
  for (let v = 0; v <= NV; v++) for (let t = 0; t <= NT; t++) {
    const th = t / NT * Math.PI * 2, a = v / NV; const R = caveR(th);
    const r = R * Math.cos(a * Math.PI * 0.5) ** 0.6, y = -0.3 + 7.0 * Math.sin(a * Math.PI * 0.5) ** 1.3;
    pos.push(Math.cos(th) * (v === 0 ? R : r), v === 0 ? -0.3 : y, Math.sin(th) * (v === 0 ? R : r));
  }
  for (let v = 0; v < NV; v++) for (let t = 0; t < NT; t++) { const a = v * (NT + 1) + t, b = a + NT + 1; idx.push(a, a + 1, b, a + 1, b + 1, b); }
  let g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx);
  g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(pos.length / 3 * 2), 2)); g.computeVertexNormals();
  if (g.attributes.normal.getY(Math.floor(NV * 0.8) * (NT + 1)) > 0) { const ix = g.index.array; for (let i = 0; i < ix.length; i += 3) { const t = ix[i + 1]; ix[i + 1] = ix[i + 2]; ix[i + 2] = t; } }
  g = lumpify(g, 0.35, 0.55, 5, 4);
  bakeVertexLight(g, lights, [0.008, 0.008, 0.008]);
  scene.add(new THREE.Mesh(g, rockMaterial(app, { tint: [0.07, 0.06, 0.055], wet: 0.8, scale: 0.6 })));
}
// floor ring (rock between pool and wall) and the pool bed rim
{
  const NT = 200; const pos = [], idx = [];
  const ring = [[0.98, 0.0], [1.0, 0.06], [1.35, 0.1], [1.8, 0.08]];
  for (let t = 0; t <= NT; t++) { const th = t / NT * Math.PI * 2; const pr = poolR(th); const cr = caveR(th) + 0.4;
    const cx = Math.cos(th), cz = Math.sin(th);
    const pts = [[pr * 0.98, -0.25], [pr, 0.06], [pr + 0.5, 0.12], [pr + (cr - pr) * 0.6, 0.15], [cr, 0.1]];
    for (const [r, y] of pts) pos.push(cx * r * 1.15 * (r === pts[pts.length - 1][0] ? 1 / 1.15 : 1), y, cz * r); }
  const NP = 5; for (let t = 0; t < NT; t++) for (let k = 0; k < NP - 1; k++) { const a = t * NP + k, b = a + NP; idx.push(a, b, a + 1, a + 1, b, b + 1); }
  let g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx);
  g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(pos.length / 3 * 2), 2)); g.computeVertexNormals();
  if (g.attributes.normal.getY(5) < 0) { const ix = g.index.array; for (let i = 0; i < ix.length; i += 3) { const t = ix[i + 1]; ix[i + 1] = ix[i + 2]; ix[i + 2] = t; } }
  g = lumpify(g, 0.12, 1.1, 9, 3);
  bakeVertexLight(g, lights, [0.008, 0.008, 0.008]);
  scene.add(new THREE.Mesh(g, rockMaterial(app, { tint: [0.075, 0.065, 0.06], wet: 1.0, scale: 1.0 })));
}
// passages (dark throats) east and west
for (const P of [PORTAL, INLET]) {
  const sgn = Math.sign(P.x); let g = new THREE.BoxGeometry(4, 3.2, P.w + 1.6, 8, 6, 6);
  g = lumpify(g, 0.15, 1.0, 3, 3); g.translate(P.x + sgn * 1.2, 1.3, P.z);
  bakeVertexLight(g, lights, [0.004, 0.004, 0.004]);
  const m = new THREE.Mesh(g, rockMaterial(app, { tint: [0.04, 0.035, 0.03] })); m.material.side = THREE.BackSide; scene.add(m);
}
// water (stand-in surface; the water agent owns the real one)
{
  const sh = new THREE.Shape(); for (let t = 0; t <= 128; t++) { const th = t / 128 * Math.PI * 2, r = poolR(th); const x = Math.cos(th) * r * 1.15, z = Math.sin(th) * r; t ? sh.lineTo(x, -z) : sh.moveTo(x, -z); }
  const g = new THREE.ShapeGeometry(sh, 4); g.rotateX(-Math.PI / 2); g.translate(0, WY, 0);
  scene.add(new THREE.Mesh(g, waterMaterial(app, { glow: [0.0, 0.07, 0.065] })));
}
// vents: rough cones with a glowing throat, lanterns
const ventMat = rockMaterial(app, { tint: [0.06, 0.05, 0.045], wet: 0.4 });
const rnd = mulberry(3);
for (const [x, z] of VENTS) { let g = new THREE.ConeGeometry(0.75, 0.6, 14, 3, true); g = lumpify(g, 0.08, 2.5, Math.floor(rnd() * 99), 3); g.translate(x, 0.3, z); bakeVertexLight(g, lights); scene.add(new THREE.Mesh(g, ventMat)); }
const lanternMat = emissiveMaterial(app, [1.0, 0.42, 0.13], 1.3);
for (const l of lights.filter(l => l.color === WARM)) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.42, 0.28), lanternMat); m.position.set(...l.pos); scene.add(m); }

// ---- fumarole schedule: each vent bursts on its own 4-9 s cycle (deterministic from the time)
const next = VENTS.map((_, i) => 1 + i * 1.7);
app.onRestart = () => { for (let i = 0; i < next.length; i++) next[i] = app.state.t + 0.5 + i * 1.3; };
app.update = (t) => {
  VENTS.forEach(([x, z], i) => {
    if (t >= next[i]) {
      next[i] = t + 4 + ((i * 7.31 + Math.floor(t)) % 5);
      // a burst: hot, dense, expanding (div), with a push toward the pool centre
      const l = Math.hypot(x, z);
      zone.event({ x, z, r: 0.9, dur: 3.2, dens: 4.5, heat: 4.0, div: 2.2, vx: -x / l * 0.6, vz: -z / l * 0.6 });
    }
  });
};
// continuous breathing from the vents
zone.setJets(VENTS.map(([x, z]) => ({ x, z, r: 0.6, dens: 0.6, heat: 0.8 })));
app.start();
</script>
</body>
