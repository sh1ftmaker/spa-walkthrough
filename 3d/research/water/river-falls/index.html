  if (uKind < 0.5){            // billowing mist off the plunge line: rises, spreads, drifts downstream
    p = vec3(mix(uImp.x - 1.5, uImp.y + 1.5, r2.x), 0.2, uImp.z + (r2.y - 0.3)*2.0);
    p += vec3((r3.x - 0.5)*6.0, uP.w*(0.35 + 0.65*r3.y), 2.0 + r3.z*7.0)*e;
  } else if (uKind < 1.5) {    // churning white water at the base
    p = vec3(mix(uImp.x - 0.5, uImp.y + 0.5, r2.x), 0.0, uImp.z + (r2.y - 0.4)*1.8);
    p += vec3((r3.x - 0.5)*2.0, uP.w*(0.3 + 0.7*r3.y)*sin(age*3.14159), 0.8 + r3.z*2.5)*e;
  } else {                     // churn at the river drops
    vec4 em = uRapids[int(r2.x*3.999)];
    p = em.xyz + vec3((r2.y - 0.5)*em.w, -0.25, (r2.z - 0.5)*1.5 - 1.0);
    p += vec3((r3.x - 0.5)*0.8, uP.w*(0.3 + 0.7*r3.y)*sin(age*3.14159), 1.0 + r3.z*2.5)*e;
  }
  float size = mix(uP.y, uP.z, e)*(0.7 + 0.6*r2.z);
  vec3 V = normalize(cameraPosition - p);
  vCol = litScatter(p, V, 0.35, 0.6);
  vA = smoothstep(0.0, 0.12, age)*(1.0 - age)*(1.0 - age);
  float rot = r.y*6.28 + age*(r.z - 0.5)*1.5; vec2 c = mat2(cos(rot), -sin(rot), sin(rot), cos(rot))*position.xy;
  vec3 wp = p + billboard(c, size);
  vUv = uv; vW = wp; vSeed = aSeed; vAge = age;
  gl_Position = projectionMatrix*viewMatrix*vec4(wp, 1.0);
}`;
const MIST_FS = GLSL_COMMON + GLSL_FRAG + /* glsl */`
uniform vec4 uTint; uniform float uSoft; uniform float uFloorY; varying float vA; varying vec2 vUv; varying vec3 vW; varying vec3 vCol; varying float vSeed; varying float vAge;
void main(){
  vec2 q = vUv*2.0 - 1.0; float rr = dot(q, q);
  float n = texture(tNoise3, vec3(vUv*0.45 + vSeed*0.0137, vAge*0.35 + uTime*0.01)).r;
  float n2 = texture(tNoise3, vec3(vUv*1.3 + vSeed*0.031, vAge*0.6 + 0.5)).b;
  float shape = smoothstep(1.0, 0.0, rr + (0.5 - n)*0.9)*smoothstep(0.0, 0.5, n2 + 0.25);
  float a = shape*vA*uTint.a*softFade(vW, uSoft)*smoothstep(1.0, 4.0, distance(vW, cameraPosition));
  a *= smoothstep(-0.3, 0.5, vW.y - uFloorY);                              // analytic water-plane fade (Low tier has no depth)
  vec3 col = uTint.rgb*vCol*(0.75 + 0.5*n);
  gl_FragColor = applyFogPM(vec4(col*a, a), vW);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;
function mistSet(count, P, tint, kind, soft, order) {
  const m = new THREE.ShaderMaterial({
    uniforms: { ...shared, uImp: dropMat.uniforms.uImp, uRapids: dropMat.uniforms.uRapids, uP: { value: new THREE.Vector4(...P) }, uTint: { value: new THREE.Vector4(...tint) }, uKind: { value: kind }, uSoft: { value: soft }, uFloorY: { value: kind > 1.5 ? -4 : 0 } },
    vertexShader: MIST_VS, fragmentShader: MIST_FS, ...ADD,
  });
  const mesh = new THREE.Mesh(instancedQuads(count), m); mesh.frustumCulled = false; mesh.renderOrder = order; scene.add(mesh); return mesh;
}
const mist = mistSet(420, [9.0, 1.5, 5.5, 8.0], [0.85, 0.95, 0.95, 0.11], 0, 2.0, 5);
const churn = mistSet(1000, [2.2, 0.6, 2.8, 3.4], [0.95, 1.0, 1.0, 0.3], 1, 0.4, 4);
const rapidChurn = mistSet(500, [1.5, 0.3, 1.0, 0.7], [0.95, 1.0, 1.0, 0.14], 2, 0.3, 4);

// ================================================================== lights for lit particles/sheets, probe, tiers
const TEAL_L = new THREE.Color(0.55, 0.95, 0.9);   // particles scatter all wavelengths: a paler teal than the bake
app.setLights([
  { pos: new THREE.Vector3(0, -0.5, IMPACT_Z + 1.2), color: TEAL_L, i: 4.5, falloff: 0.1 },          // pool uplight under the plunge
  { pos: new THREE.Vector3(-4.5, -0.5, IMPACT_Z + 1.5), color: TEAL_L, i: 2.0, falloff: 0.15 },
  { pos: new THREE.Vector3(4.5, -0.5, IMPACT_Z + 1.5), color: TEAL_L, i: 2.0, falloff: 0.15 },
  ...lanterns.slice(0, 4).map(p => ({ pos: new THREE.Vector3(...p), color: WARM, i: 3.5, falloff: 0.25 })),      // gallery behind the falls
  { pos: new THREE.Vector3(...lanterns[4]), color: WARM, i: 2.5, falloff: 0.3 },
], new THREE.Color(0.02, 0.05, 0.05));
const fxMeshes = [water, drops, mist, churn, rapidChurn, ...fallLayers];
const env = bakeProbe(renderer, scene, new THREE.Vector3(0, 1.5, 0), 128, fxMeshes);
waterMat.uniforms.tEnv.value = env; fallLayers.forEach(m => m.material.uniforms.tEnv.value = env);
app.extraTexBytes += 128 * 128 * 6 * 8 * 4 / 3;
app.sceneTexture = true; app.fx(...fxMeshes);
app.groups = { rock: [terrain, cliff, ceiling, boulders, lanternMesh], water: [water], falls: fallLayers, particles: [drops, mist, churn, rapidChurn] };

let lastLow = null;
const setLow = low => {
  lastLow = low;
  terrain.geometry.dispose(); terrain.geometry = buildTerrain(low);
  water.geometry.dispose(); water.geometry = buildWater(low);
  drops.geometry.instanceCount = low ? 3000 : 24000; fallLayers[1].visible = !low;
  mist.geometry.instanceCount = low ? 70 : 420; churn.geometry.instanceCount = low ? 160 : 1000; rapidChurn.geometry.instanceCount = low ? 60 : 500;
  // Low keeps the look with fewer, slightly denser particles
  mist.material.uniforms.uTint.value.w = low ? 0.16 : 0.11; churn.material.uniforms.uTint.value.w = low ? 0.42 : 0.3;
};
let lastT = app.state.t;
app.update = (t, dt) => {
  if (lastLow !== app.state.low) setLow(app.state.low);
  simTick(dt);
  waterMat.uniforms.tFoam.value = foamSim.texture;
  fallLayers.forEach(m => m.material.uniforms.tSheet.value = sheetSim.texture);
  dropMat.uniforms.tSheet.value = sheetSim.texture;
  // pixel angle for the droplet width clamp
  dropMat.uniforms.uPix.value = 2 * Math.tan(app.camera.fov * Math.PI / 360) / Math.max(1, renderer.domElement.height);
};
app.start();
</script>
