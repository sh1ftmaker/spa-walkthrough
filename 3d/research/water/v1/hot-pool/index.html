  fragmentShader: P_HEAD + /* glsl */`varying vec2 vUv; varying float vA; varying vec3 vW;
    void main(){ vec2 q = vUv*2.0-1.0; float r = dot(q,q); if (r > 1.0) discard;
      float rim = smoothstep(0.55, 1.0, r)*0.9 + smoothstep(0.25, 0.0, dot(q-vec2(-0.35,0.35), q-vec2(-0.35,0.35)))*1.5;
      float a = (0.25 + rim)*vA*(1.0 - smoothstep(0.9, 1.0, r));
      vec3 col = vec3(0.7, 0.95, 0.95)*0.9;
      gl_FragColor = vec4(col*a, a);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
  transparent: true, depthWrite: false, blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
});
const bubbles = new THREE.Mesh(instancedQuads(900), bubbleMat); bubbles.frustumCulled = false; bubbles.renderOrder = 1; scene.add(bubbles);

// geyser jet: streak droplets, emission gated by the eruption envelope at spawn time
const GEYSER_ENV = /* glsl */`
uniform float uCycle;
float eruptAt(float t){ float c = mod(t, uCycle); return smoothstep(3.0, 3.6, c)*(1.0 - smoothstep(7.5, 10.5, c))*(0.8 + 0.2*sin(c*13.0)*sin(c*7.3)); }`;
const jetMat = new THREE.ShaderMaterial({
  uniforms: { ...shared, uCycle: { value: 16 } },
  vertexShader: P_HEAD + GEYSER_ENV + /* glsl */`attribute float aSeed; varying vec2 vUv; varying float vA; varying vec3 vW;
    void main(){
      vec3 r = hash31(aSeed*1.91 + 0.3); float life = 3.2;
      float tt = uTime + r.x*life; float age = mod(tt, life); float cyc = floor(tt/life);
      vec3 r2 = hash31(aSeed*5.3 + cyc*17.1), r3 = hash31(aSeed*2.3 + cyc*7.9 + 3.0);
      float E = eruptAt(uTime - age);
      float on = step(r2.z, E);
      float ang = r2.x*6.2832, spread = mix(0.02, 0.22, r2.y*r2.y);
      float sp = mix(9.0, 17.0, r3.x)*mix(0.7, 1.0, E);
      vec3 v0 = vec3(cos(ang)*sin(spread), cos(spread), sin(ang)*sin(spread))*sp;
      vec3 p0 = vec3(cos(ang), 0.0, sin(ang))*0.25*r3.y + vec3(0.0, 0.3, 0.0);
      float k = 0.35;
      vec3 p = p0 + v0*(1.0-exp(-k*age))/k; p.y -= 4.9*age*age;
      vec3 vel = v0*exp(-k*age) - vec3(0.0, 9.81*age, 0.0);
      float alive = on*step(-0.05, p.y);
      vA = alive*smoothstep(0.0, 0.05, age)*(1.0 - age/life);
      float w = mix(0.03, 0.08, r3.z), len = 0.08 + length(vel)*0.03;
      vec3 wp = p + streak(position.xy, p, vel, w, len)*alive;
      vUv = uv; vW = wp; gl_Position = projectionMatrix*viewMatrix*vec4(wp,1.0);
    }`,
  fragmentShader: P_HEAD + /* glsl */`varying vec2 vUv; varying float vA; varying vec3 vW;
    void main(){ float x = vUv.x*2.0-1.0, y = vUv.y*2.0-1.0; float a = (1.0-x*x)*(1.0-y*y)*vA*0.6;
      float up = mix(1.3, 0.7, clamp(vW.y/12.0, 0.0, 1.0));
      vec3 col = vec3(0.55, 0.92, 0.88)*up;
      gl_FragColor = applyFogPM(vec4(col*a, a*0.25), vW);   // mostly additive: lit droplets never darken what is behind them
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
  transparent: true, depthWrite: false, blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
});
const jet = new THREE.Mesh(instancedQuads(3000), jetMat); jet.frustumCulled = false; jet.renderOrder = 5; scene.add(jet);
// droplets are left out of the planar reflection (layer 1 is only enabled on the main camera): cheaper, and they
// rendered as dark specks in the half-float mirror target
jet.layers.set(1); camera.layers.enable(1);

// geyser column core: open cylinders whose texture streams upward; height follows the envelope
const COLUMN_FS = GLSL_COMMON + /* glsl */`uniform float uH; uniform float uLayer; varying vec2 vUv; varying vec3 vW;
  void main(){
    float s = vUv.y*uH;                                   // metres up the column
    float n1 = texture(tNoise, vec2(vUv.x*3.0 + uLayer, s*0.18 - uTime*1.6)).r;
    float n2 = texture(tNoise, vec2(vUv.x*7.0 + uLayer*2.0, s*0.35 - uTime*2.4)).a;
    float n = n1*0.6 + n2*0.4;
    float top = 1.0 - smoothstep(0.55, 1.0, vUv.y);
    float a = smoothstep(0.38 + 0.25*vUv.y, 0.62 + 0.2*vUv.y, n)*top*mix(0.85, 0.45, uLayer);
    a *= smoothstep(0.0, 0.03, vUv.y);
    vec3 V = normalize(cameraPosition - vW);
    float up = mix(1.4, 0.75, vUv.y);
    vec3 col = mix(vec3(0.20, 0.75, 0.70), vec3(0.75, 0.95, 0.95), smoothstep(0.45, 0.8, n))*up;
    gl_FragColor = applyFogPM(vec4(col*a, a), vW);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }`;
const columns = [0, 1].map(layer => {
  const g = new THREE.CylinderGeometry(1, 1, 1, 20, 24, true); g.translate(0, 0.5, 0);
  const m = new THREE.ShaderMaterial({
    uniforms: { ...shared, uH: { value: 0 }, uLayer: { value: layer }, uW: { value: layer ? 1.1 : 0.55 } },
    vertexShader: /* glsl */`uniform float uH; uniform float uW; uniform float uTime; uniform sampler2D tNoise; varying vec2 vUv; varying vec3 vW;
      void main(){ float y = position.y*uH; float w = uW*(1.0 + position.y*1.6);
        float wob = textureLod(tNoise, vec2(uv.x*2.0, y*0.1 - uTime*0.5), 0.0).r - 0.5;
        vec3 p = vec3(position.x*w*(1.0+wob*0.5), y, position.z*w*(1.0+wob*0.5));
        vUv = uv; vW = (modelMatrix*vec4(p,1.0)).xyz; gl_Position = projectionMatrix*viewMatrix*vec4(vW,1.0); }`,
    fragmentShader: COLUMN_FS, transparent: true, depthWrite: false, side: THREE.DoubleSide,
    blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
  });
  const mesh = new THREE.Mesh(g, m); mesh.frustumCulled = false; mesh.renderOrder = 4 + layer * 0.1; scene.add(mesh); return mesh;
});

// steam: pool wisps, geyser plume, fumarole jet (one draw each)
const STEAM_VS = P_HEAD + GEYSER_ENV + POOL_GLSL + /* glsl */`
attribute float aSeed; uniform vec4 uP; uniform float uKind; // life, size0, size1, rise
varying float vA; varying vec2 vUv; varying vec3 vW; varying float vSeed;
void main(){
  float life = uP.x; vec3 r = hash31(aSeed*2.17 + 0.3 + uKind);
  float tt = uTime + r.x*life; float age = mod(tt, life)/life; float cyc = floor(tt/life);
  vec3 r2 = hash31(aSeed*5.71 + cyc*9.1 + uKind*3.0), r3 = hash31(aSeed*1.91 + cyc*3.3 + 1.0);
  vec3 p; float gate = 1.0;
  float e = 1.0 - pow(1.0 - age, 1.8);
  if (uKind < 0.5) {          // wisps lifting off the hot pool
    float th = r2.x*6.2832; float rr = sqrt(r2.y)*poolRadius(th)*0.92;
    p = vec3(cos(th)*rr, 0.05, sin(th)*rr) + vec3((r3.x-0.5)*1.5 + e*1.2, uP.w*e*(0.6 + 0.6*r3.y), (r3.z-0.5)*1.5 + e*0.4);
  } else if (uKind < 1.5) {   // geyser plume: born along the column while it erupts
    float E = eruptAt(uTime - age*life);
    gate = step(r2.z, E*1.2);
    p = vec3((r2.x-0.5)*1.2, r2.y*12.0*E, (r3.x-0.5)*1.2) + vec3((r3.y-0.5)*3.0 + e*2.5, uP.w*e, (r3.z-0.5)*3.0);
  } else {                    // fumarole: a steady hissing jet from a rock crack
    p = vec3(-9.5, 0.6, -7.0) + vec3((r3.x-0.5)*0.4*e + e*1.0, uP.w*e*(0.8 + 0.4*r3.y), (r3.z-0.5)*0.4*e + e*0.6);
  }
  float size = mix(uP.y, uP.z, e)*(0.7 + 0.6*r2.z);
  vA = gate*smoothstep(0.0, 0.15, age)*(1.0 - age)*(1.0 - age);
  float rot = r.y*6.28 + age*(r.z-0.5)*2.0; vec2 c = mat2(cos(rot),-sin(rot),sin(rot),cos(rot))*position.xy;
  vec3 wp = p + billboard(c, size);
  vUv = uv; vW = wp; vSeed = aSeed;
  gl_Position = projectionMatrix*viewMatrix*vec4(wp,1.0);
}`;
const STEAM_FS = P_HEAD + /* glsl */`
uniform sampler2D tPuff; uniform vec4 uTint; varying float vA; varying vec2 vUv; varying vec3 vW; varying float vSeed;
void main(){
  vec2 wob = (texture(tNoise, vUv*0.6 + vec2(vSeed*0.137, uTime*0.04)).rg - 0.5)*0.3;
  vec4 t = texture(tPuff, vUv + wob);
  float wisp = texture(tNoise, vUv*vec2(0.9, 0.35) + vec2(vSeed*0.173, -uTime*0.05)).r;
  float a = t.a*t.a*vA*uTint.a*smoothstep(0.3, 0.8, wisp + t.a*0.2)*1.8;
  a *= smoothstep(-0.1, 0.6, vW.y);
  a *= smoothstep(1.0, 4.0, distance(vW, cameraPosition));
  float shade = 0.8 + 0.25*texture(tNoise, vUv*0.7 + vec2(vSeed*0.31, 0.0)).r;
  float up = mix(1.2, 0.7, clamp(vW.y/8.0, 0.0, 1.0));
  gl_FragColor = applyFogPM(vec4(uTint.rgb*t.rgb*shade*up*a, a), vW);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;
function steam(count, P, tint, kind, order) {
  const m = new THREE.ShaderMaterial({
    uniforms: { ...shared, uP: { value: new THREE.Vector4(...P) }, uTint: { value: new THREE.Vector4(...tint) }, uKind: { value: kind }, tPuff: { value: app.tex.puff }, uCycle: jetMat.uniforms.uCycle },
    vertexShader: STEAM_VS, fragmentShader: STEAM_FS, transparent: true, depthWrite: false,
    blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
  });
  const mesh = new THREE.Mesh(instancedQuads(count), m); mesh.frustumCulled = false; mesh.renderOrder = order; scene.add(mesh); return mesh;
}
const wisps = steam(90, [7.0, 1.0, 3.6, 3.2], [0.5, 0.66, 0.68, 0.10], 0, 6);
const plume = steam(70, [5.0, 2.0, 6.5, 6.0], [0.5, 0.7, 0.72, 0.16], 1, 6);
const fumarole = steam(36, [3.5, 0.5, 2.8, 5.0], [0.5, 0.58, 0.58, 0.12], 2, 6);

// ------------------------------------------------------------------ probe + tier switching
envTex = bakeProbe(renderer, scene, new THREE.Vector3(0, 1.2, 5), 128, [water, bubbles, jet, ...columns, wisps, plume, fumarole, mirror, mirrorLow]);
mirrorLowMat.uniforms.tEnv.value = envTex;
app.extraTexBytes += 128 * 128 * 6 * 8 * 4 / 3;
let lastLow = null;
function setLow(low) {
  lastLow = low;
  makeSim(low ? 64 : 128);
  app.extraTexBytes = 128 * 128 * 6 * 8 * 4 / 3 + simRes * simRes * 8 * 2 + (low ? 0 : 512 * 512 * 4);
  ground.geometry.dispose(); ground.geometry = buildGround(low);
  water.geometry = low ? waterGeoLo : waterGeoHi;
  water.material?.dispose(); water.material = makeWaterMat(simRes, low);
  mirror.visible = !low; mirrorLow.visible = low;
  bubbles.geometry.instanceCount = low ? 300 : 900; jet.geometry.instanceCount = low ? 1000 : 3000;
  wisps.geometry.instanceCount = low ? 40 : 90; plume.geometry.instanceCount = low ? 30 : 70; fumarole.geometry.instanceCount = low ? 16 : 36;
  columns[1].visible = !low;
}
setLow(app.state.low);
app.groups = { rock: [ground, ceiling, lanternMesh], water: [water, bubbles], geyser: [jet, ...columns], plume: [plume], steam: [wisps, fumarole], mirror: [mirror, mirrorLow] };

// eruption envelope on the CPU too (drives the sim and the column height)
const eruptAt = t => { const c = ((t % 16) + 16) % 16; const ss = (a, b, x) => { const u = Math.max(0, Math.min(1, (x - a) / (b - a))); return u * u * (3 - 2 * u); }; return ss(3, 3.6, c) * (1 - ss(7.5, 10.5, c)) * (0.8 + 0.2 * Math.sin(c * 13) * Math.sin(c * 7.3)); };
const preSurge = t => { const c = ((t % 16) + 16) % 16; return c > 0.5 && c < 3.2 ? Math.sin((c - 0.5) / 2.7 * Math.PI) : 0; };
let lastT = 0;
app.update = (t, dt) => {
  if (lastLow !== app.state.low) setLow(app.state.low);
  const E = eruptAt(t);
  ventU.uErupt.value = Math.max(E, preSurge(t) * 0.6);
  columns.forEach((c, i) => c.material.uniforms.uH.value = E * (i ? 9 : 13));
  // bubble bursts (Poisson per vent), geyser surge, rain-back
  const step = dt;
  VENTS.forEach(([x, z, k], i) => {
    const rate = i === 0 ? 2 + 10 * ventU.uErupt.value : 7 * k;
    if (rnd() < rate * step) pending.push([x + (rnd() - 0.5) * 1.2 * k, z + (rnd() - 0.5) * 1.2 * k, 0.25 + rnd() * 0.25, (rnd() < 0.5 ? -1 : 1) * 0.035 * (0.5 + rnd())]);
  });
  if (preSurge(t) > 0) pending.push([0, 0, 1.4, 0.004 * preSurge(t)]);
  if (E > 0.05) {
    pending.push([0, 0, 0.9, 0.02 * E]);
    for (let i = 0; i < 4; i++) { const a = rnd() * 6.283, r = 1.2 + rnd() * 4.0; pending.push([Math.cos(a) * r, Math.sin(a) * r, 0.25, -0.02 * E * rnd()]); }
  }
  lastT = t;
};
app.preRender = () => {
  simAcc += app.state.paused ? 0 : 1 / 60;
  let n = 0; while (simAcc >= 1 / 60 && n < 3) { stepSim(); simAcc -= 1 / 60; n++; }
  if (n === 0) stepSim.idle = true;
  renderer.setRenderTarget(null);
};
// taps on the water make splashes
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
renderer.domElement.addEventListener('pointerdown', e => {
  ndc.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1); ray.setFromCamera(ndc, camera);
  if (ray.ray.intersectPlane(plane, hit) && poolSdf(hit.x, hit.z) < 0) pending.push([hit.x, hit.z, 0.5, -0.08]);
});
// warm the sim so screenshots start with live ripples
for (let i = 0; i < 240; i++) { app.update(app.state.t - 4 + i / 60, 1 / 60); stepSim(); }
app.start();
</script>
</body>
