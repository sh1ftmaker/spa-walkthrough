  float ph0 = fract(uTime/cyc + jitter), ph1 = fract(uTime/cyc + jitter + 0.5);
  float w0 = 1.0 - abs(1.0-2.0*ph0), w1 = 1.0 - w0;
  vec2 o0 = flow*ph0*cyc, o1 = flow*ph1*cyc;
  vec2 uvN = vW.xz*0.22;
  vec3 n0 = texture(tNormal, (vW.xz - o0)*0.22).xyz*2.0-1.0;
  vec3 n1 = texture(tNormal, (vW.xz - o1)*0.22 + 0.5).xyz*2.0-1.0;
  vec2 nd = (n0.xy*w0 + n1.xy*w1);
#ifndef LOW
  vec3 n2 = texture(tNormal, (vW.xz - o0)*0.61 + 0.27).xyz*2.0-1.0;
  vec3 n3 = texture(tNormal, (vW.xz - o1)*0.61 + 0.77).xyz*2.0-1.0;
  nd += (n2.xy*w0 + n3.xy*w1)*0.6;
#endif
  float strength = 0.25 + speed*0.1 + foamP*0.6;
  vec3 N = normalize(vN + vec3(nd.x, 0.0, nd.y)*strength);
  vec3 V = normalize(cameraPosition - vW);
  float NdV = max(dot(N,V), 0.0);
  float F = 0.02 + 0.98*pow(1.0-NdV, 5.0);
  vec3 R = reflect(-V, N);
  vec3 refl = textureLod(tEnv, R, 1.0 + foamP*3.0).rgb*0.75;
  // sharp glints of the nearest lanterns (analytic, exact parallax)
  vec3 spec = vec3(0.0);
  for (int i=0;i<6;i++){ vec3 L = uGl[i].xyz - vW; float d2 = dot(L,L); L *= inversesqrt(d2); vec3 H = normalize(L+V);
    spec += uGlCol*pow(max(dot(N,H),0.0), 420.0)*uGl[i].w*30.0/(1.0+d2*0.04); }
  // foam: advected lace, thresholded by the baked foam potential so it breaks up instead of fading
  // foam pattern in a flow-aligned frame so it streaks along the current, advected with the same two phases
  vec2 dir = speed > 0.05 ? flow/speed : vec2(0.0, 1.0);
  vec2 perp = vec2(-dir.y, dir.x);
  vec2 pa = vec2(dot(vW.xz, perp), dot(vW.xz, dir));
  float st = 1.0/(1.0 + speed*0.35);                 // faster water -> longer streaks
  float a0 = speed*ph0*cyc, a1 = speed*ph1*cyc;
  float l0 = 1.0 - texture(tNoise, vec2(pa.x*0.33, (pa.y - a0)*0.33*st)).g;
  float l1 = 1.0 - texture(tNoise, vec2(pa.x*0.33 + 0.5, (pa.y - a1)*0.33*st + 0.5)).g;
  float k0 = texture(tNoise, vec2(pa.x*0.07, (pa.y - a0)*0.07*st)).r;
  float k1 = texture(tNoise, vec2(pa.x*0.07 + 0.5, (pa.y - a1)*0.07*st + 0.5)).r;
  float lace = l0*w0 + l1*w1, big = k0*w0 + k1*w1;

  float pat = lace*0.35 + big*0.65;

  float foam = smoothstep(1.0-cover-0.09, 1.0-cover+0.09, pat) * smoothstep(0.03, 0.12, cover);
  float fresh = smoothstep(0.4, 1.0, foamP);
  float relief = clamp(0.5 + 1.3*dot(N, normalize(vec3(0.25, 0.8, 0.45))) - 0.75, 0.2, 1.2);
  vec3 foamCol = vec3(0.60,0.78,0.78)*(0.22 + 0.5*fresh*pat + 0.15*lace)*relief + vec3(0.9,0.5,0.25)*0.03;
  float a = clamp(F, 0.0, 1.0);
  vec3 col = refl*F + spec;
  vec4 outc = vec4(col*(1.0-foam) + foamCol*foam, a*(1.0-foam) + foam);
  // shoreline: thin water fades out where it meets the bank
  float shore = smoothstep(0.0, 0.08, depth);
  outc *= shore;
  outc = applyFogPM(outc, vW);
  gl_FragColor = outc;
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;
const glints = lanterns.slice(0, 6).map(p => new THREE.Vector4(p[0], p[1], p[2], 1));
const waterMat = new THREE.ShaderMaterial({
  uniforms: { ...shared, ...flowU, tNormal: { value: app.tex.normal }, tEnv: { value: null }, uGl: { value: glints }, uGlCol: { value: new THREE.Color(1.0, 0.6, 0.3) } },
  vertexShader: WATER_VS, fragmentShader: WATER_FS, transparent: true, depthWrite: false,
  blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
});
function buildWater(low) {
  const nx = low ? 40 : 80, nzc = low ? 110 : 220;
  const g = new THREE.PlaneGeometry(FM.w, FM.h, nx, nzc); g.rotateX(-Math.PI / 2); g.translate(FM.x0 + FM.w / 2, 0, FM.z0 + FM.h / 2);
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) pos.setY(i, waterLevelAt(pos.getX(i), pos.getZ(i)));

}
const water = new THREE.Mesh(buildWater(app.state.low), waterMat); water.renderOrder = 1; scene.add(water);

// ------------------------------------------------------------------ waterfall cards: v = time of flight, texture advects at true speed
const FALL_VS = /* glsl */`
uniform float uTime; uniform sampler2D tNoise; uniform vec4 uLip; uniform vec4 uLayer; // lip: y, z, halfWidth, vz | layer: dz, widen, seed, kind
uniform float uT;
varying vec2 vUv; varying float vTau; varying vec3 vW;
void main(){
  float lipN = textureLod(tNoise, vec2(uv.x*0.9 + uLayer.z*0.1, 0.37), 0.0).r - 0.5;
  float tau = uv.y*uT;
  float x = (uv.x-0.5)*2.0*uLip.z*(1.0 + uLayer.y*uv.y) ;
  float yOff = lipN*1.6*(1.0-uv.y*0.6);
  float wob = textureLod(tNoise, vec2(uv.x*1.7 + uLayer.z, tau*0.25 - uTime*0.07), 0.0).r - 0.5;
  float z = uLip.y + uLip.w*tau + uLayer.x + wob*1.4*uv.y;
  float y = uLip.x + yOff - 0.5*9.81*tau*tau;
  vec3 p = vec3(x, y, z);
  vUv = uv; vTau = tau; vW = (modelMatrix*vec4(p,1.0)).xyz;
  gl_Position = projectionMatrix*viewMatrix*vec4(vW,1.0);
}`;
const FALL_FS = GLSL_COMMON + /* glsl */`
uniform vec4 uLayer; uniform float uT; uniform samplerCube tEnv;
varying vec2 vUv; varying float vTau; varying vec3 vW;
void main(){
  float s = vTau - uTime;                  // material coordinate: same water parcel => same s
  float f = vTau/uT;                       // 0 at lip, 1 at impact
  float sd = uLayer.z;
  float n1 = texture(tNoise, vec2(vUv.x*7.0 + sd, s*0.35)).r;
  float n2 = texture(tNoise, vec2(vUv.x*19.0 + sd*2.0, s*0.8)).a;
  float n3 = texture(tNoise, vec2(vUv.x*47.0 + sd*3.0, s*1.9)).r;
  float strands = n1*0.5 + n2*0.35 + n3*0.25;
  float aer = smoothstep(0.0, 0.28, f);
  // the glassy tongue near the lip becomes a broken white curtain lower down
  float th = mix(0.12, 0.5, aer) + uLayer.w*0.12;
  float alpha = smoothstep(th, th+0.16, strands);
  float edge = min(vUv.x, 1.0-vUv.x)*2.0;
  alpha *= smoothstep(0.0, 0.12 + 0.25*n2, edge - (1.0-n1)*0.08*f);
  float glass = 1.0 - aer;
  alpha = mix(alpha, 0.25 + 0.3*n1*n1, glass*(1.0-uLayer.w));
  alpha *= mix(0.95, 0.55, uLayer.w);
  alpha *= smoothstep(0.0, 0.05, f);
  // lighting: teal-white uplight from the plunge pool, warm backlight shining through thin parts
  float up = mix(0.22, 0.85, f*f);
  float side = 1.0 - pow(abs(vUv.x*2.0-1.0), 3.0)*0.5;
  vec3 white = mix(vec3(0.30,0.48,0.50), vec3(0.72, 0.90, 0.90), smoothstep(0.35, 0.75, strands))*up*side;
  vec3 back = vec3(1.0, 0.55, 0.22)*0.6*(1.0-alpha)*smoothstep(0.2, 0.9, f)*(1.0-f*0.5);
  vec3 V = normalize(cameraPosition - vW);
  vec3 glassCol = textureLod(tEnv, reflect(-V, vec3(0.0,0.3,1.0)), 2.0).rgb*0.6 + vec3(0.05,0.3,0.28);
  vec3 col = mix(white, glassCol, glass*0.7) + back;
  col += pow(n3, 6.0)*0.6*aer*up;            // bright drop clumps
  vec4 o = vec4(col*alpha, alpha);
  o = applyFogPM(o, vW);
  gl_FragColor = o;
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;
const fallGeo = new THREE.PlaneGeometry(1, 1, 24, 60); { const uv = fallGeo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setY(i, 1 - uv.getY(i)); }
const fallLayers = [
  [0.0, 0.10, 0.0, 0.0, 1],   // core sheet
  [0.45, 0.22, 3.7, 1.0, 2],  // front veil, more broken
  [-0.35, 0.05, 7.1, 0.5, 3], // back layer (seen from the walk-behind ledge)
].map(([dz, widen, seed, kind, order]) => {
  const m = new THREE.ShaderMaterial({
    uniforms: { ...shared, uLip: { value: new THREE.Vector4(LIP.y, LIP.z, LIP.half, LIP.vz) }, uLayer: { value: new THREE.Vector4(dz, widen, seed, kind) }, uT: { value: TFALL }, tEnv: { value: null } },
    vertexShader: FALL_VS, fragmentShader: FALL_FS, transparent: true, depthWrite: false, side: THREE.DoubleSide,
    blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
  });
  const mesh = new THREE.Mesh(fallGeo, m); mesh.frustumCulled = false; mesh.renderOrder = 2 + order * 0.1; scene.add(mesh); return mesh;
});

// ------------------------------------------------------------------ particles: spray streaks, spume blobs, mist billows (all GPU-driven)
const PART_HEAD = GLSL_COMMON + BILLBOARD_GLSL;
const sprayMat = new THREE.ShaderMaterial({
  uniforms: { ...shared, uImp: { value: new THREE.Vector4(-LIP.half, LIP.half, IMPACT_Z, 0) }, uRapids: { value: [] }, uNF: { value: 0 } },
  vertexShader: PART_HEAD + /* glsl */`
    attribute float aSeed; uniform vec4 uImp; uniform float uNF; uniform vec4 uRapids[4];
    varying float vA; varying vec2 vUv; varying vec3 vW;
    void main(){
      bool falls = aSeed < uNF;
      float life = falls ? 1.6 : 0.9;
      vec3 r = hash31(aSeed*1.37+0.1);
      float tt = uTime + r.x*life; float age = mod(tt, life); float cyc = floor(tt/life);
      vec3 r2 = hash31(aSeed*7.13 + cyc*13.7), r3 = hash31(aSeed*3.1 + cyc*5.3 + 2.0);
      vec3 p0, v0;
      if (falls){
        p0 = vec3(mix(uImp.x, uImp.y, r2.x), 0.05, uImp.z + (r2.y-0.5)*1.6);
        float ang = r2.z*6.2832; float sp = mix(2.0, 11.0, r3.x*r3.x);
        v0 = normalize(vec3(cos(ang)*0.75, mix(0.35,1.5,r3.y), sin(ang)*0.6 + 0.55))*sp;
      } else {
        vec4 e = uRapids[int(r2.x*3.999)];
        p0 = e.xyz + vec3((r2.y-0.5)*e.w, 0.0, (r2.z-0.5)*0.8);
        float sp = mix(1.0, 3.5, r3.x);
        v0 = vec3((r3.y-0.5)*1.6, mix(1.0, 2.6, r3.z), (r3.z-0.5)*1.4 + 1.2)*sp*0.6;
      }
      float k = 0.8; float g = 9.81*0.8;
      vec3 p = p0 + v0*(1.0-exp(-k*age))/k; p.y -= 0.5*g*age*age;
      vec3 vel = v0*exp(-k*age) - vec3(0.0, g*age, 0.0);
      float floorY = falls ? 0.0 : p0.y - 0.2;
      float alive = step(floorY, p.y);
      vA = alive*smoothstep(0.0, 0.08, age)*(1.0 - age/life);
      float w = mix(0.008, 0.025, r3.z), len = 0.03 + length(vel)*0.025;
      vec3 wp = p + streak(position.xy, p, vel, w, len)*alive;
      vUv = uv; vW = wp;
      gl_Position = projectionMatrix*viewMatrix*vec4(wp,1.0);
    }`,
  fragmentShader: PART_HEAD + /* glsl */`
    varying float vA; varying vec2 vUv; varying vec3 vW;
    void main(){
      float x = vUv.x*2.0-1.0, y = vUv.y*2.0-1.0;
      float a = (1.0-x*x)*(1.0-y*y)*vA*0.6*smoothstep(1.0, 3.0, distance(vW, cameraPosition));
      vec3 col = vec3(0.75,0.92,0.92)*1.2;
      vec4 o = applyFogPM(vec4(col*a, a), vW);
      gl_FragColor = o;
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
  transparent: true, depthWrite: false, blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
});
// rapids emitters at the drops
const rapidEm = DROPS.map(([s]) => { const p = proj(0, 0); let acc = 0, i = 0; while (i < segLen.length - 1 && acc + segLen[i] < s) { acc += segLen[i]; i++; } const t = (s - acc) / segLen[i]; const x = CL[i][0] + (CL[i + 1][0] - CL[i][0]) * t, z = CL[i][1] + (CL[i + 1][1] - CL[i][1]) * t; return new THREE.Vector4(x, level(s + 1.5), z + 1.2, width(s) * 1.4); });
sprayMat.uniforms.uRapids.value = rapidEm;
const spray = new THREE.Mesh(instancedQuads(4000), sprayMat); spray.frustumCulled = false; spray.renderOrder = 5; scene.add(spray);

const PUFF_VS = PART_HEAD + /* glsl */`
attribute float aSeed; uniform vec4 uImp; uniform vec4 uP; // uP: life, size0, size1, rise
uniform float uKind; uniform vec4 uEm[4]; varying float vA; varying vec2 vUv; varying vec3 vW; varying float vSeed;
void main(){
  float life = uP.x; vec3 r = hash31(aSeed*2.17+0.3);
  float tt = uTime + r.x*life; float age = mod(tt, life)/life; float cyc = floor(tt/life);
  vec3 r2 = hash31(aSeed*5.71 + cyc*9.1), r3 = hash31(aSeed*1.91 + cyc*3.3 + 1.0);
  vec3 p = vec3(mix(uImp.x-1.0, uImp.y+1.0, r2.x), 0.0, uImp.z + (r2.y-0.3)*2.5);
  float e = 1.0 - pow(1.0-age, 2.2);                    // fast start, slow end
  if (uKind > 1.5) {                                    // churning white water at the river drops
    vec4 em = uEm[int(r2.x*3.999)];
    p = em.xyz + vec3((r2.y-0.5)*em.w, -0.1, (r2.z-0.5)*1.5);
    p += vec3((r3.x-0.5)*0.8, uP.w*(0.3+0.7*r3.y), 1.0 + r3.z*2.5)*e;
  } else
  p += vec3((r3.x-0.5)*3.0, uP.w*(0.4+0.6*r3.y), 1.5 + r3.z*3.5)*e;
  p.y += (uKind > 0.5 && uKind < 1.5) ? e*e*4.0 : 0.0;
  float size = mix(uP.y, uP.z, e)*(0.7 + 0.6*r2.z);
  vA = smoothstep(0.0, 0.12, age)*(1.0-age)*(1.0-age);
  float rot = r.y*6.28 + age*(r.z-0.5)*1.5; vec2 c = mat2(cos(rot),-sin(rot),sin(rot),cos(rot))*position.xy;
  vec3 wp = p + billboard(c, size);
  vUv = uv; vW = wp; vSeed = aSeed;
  gl_Position = projectionMatrix*viewMatrix*vec4(wp,1.0);
}`;
const PUFF_FS = PART_HEAD + /* glsl */`
uniform sampler2D tPuff; uniform vec4 uTint; uniform float uKind; uniform float uFloorY; uniform vec4 uEm[4]; varying float vA; varying vec2 vUv; varying vec3 vW; varying float vSeed;
void main(){
  vec2 wob = (texture(tNoise, vUv*0.6 + vec2(vSeed*0.137, uTime*0.03)).rg - 0.5)*0.25;
  vec4 t = texture(tPuff, vUv + wob);
  float a = t.a*vA*uTint.a;
  a *= smoothstep(-0.2, 0.9, vW.y - uFloorY);              // analytic soft-particle: fade into the water plane
  a *= smoothstep(2.0, 7.0, distance(vW, cameraPosition)); // fade when the camera is inside the cloud
  float up = mix(1.1, 0.6, clamp(vW.y/10.0, 0.0, 1.0));
  float shade = 0.55 + 0.6*texture(tNoise, vUv*0.7 + vec2(vSeed*0.31, 0.0)).r;   // lumpy self-shadowing
  vec3 col = uTint.rgb*t.rgb*up*shade;
  gl_FragColor = applyFogPM(vec4(col*a, a), vW);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;
function puffs(count, P, tint, kind, order) {
  const m = new THREE.ShaderMaterial({
    uniforms: { ...shared, uImp: sprayMat.uniforms.uImp, uP: { value: new THREE.Vector4(...P) }, uTint: { value: new THREE.Vector4(...tint) }, uKind: { value: kind }, tPuff: { value: app.tex.puff }, uEm: { value: [0, 0, 0, 0].map(() => new THREE.Vector4()) }, uFloorY: { value: 0 } },
    vertexShader: PUFF_VS, fragmentShader: PUFF_FS, transparent: true, depthWrite: false,
    blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
  });
  const mesh = new THREE.Mesh(instancedQuads(count), m); mesh.frustumCulled = false; mesh.renderOrder = order; scene.add(mesh); return mesh;
}
const spume = puffs(220, [2.4, 0.8, 4.2, 3.2], [0.34, 0.48, 0.48, 0.24], 0, 3);
const mist = puffs(60, [8.0, 4.0, 11.0, 9.0], [0.45, 0.62, 0.62, 0.10], 1, 4);
const churn = puffs(120, [1.6, 0.5, 2.2, 0.9], [0.40, 0.55, 0.55, 0.30], 2, 3);
churn.material.uniforms.uEm.value = rapidEm.map(v => new THREE.Vector4(v.x, v.y - 0.3, v.z - 1.0, v.w)); churn.material.uniforms.uFloorY.value = -4;

// ------------------------------------------------------------------ reflection probe (stand-in for a baked Cycles cubemap)
const fx = [water, spray, spume, mist, churn, ...fallLayers];
const env = bakeProbe(renderer, scene, new THREE.Vector3(0, 1.5, 0), 128, fx);
waterMat.uniforms.tEnv.value = env; fallLayers.forEach(m => m.material.uniforms.tEnv.value = env);
app.extraTexBytes += 128 * 128 * 6 * 8 * 4 / 3;

app.groups = { rock: [terrain, cliff, ceiling, boulders, lanternMesh], water: [water], falls: fallLayers, particles: [spray, spume, mist, churn] };

// ------------------------------------------------------------------ tiers
let lastLow = null;
app.start;
const setLow = low => {
  if (lastLow === low) return; lastLow = low;
  terrain.geometry.dispose(); terrain.geometry = buildTerrain(low);
  water.geometry.dispose(); water.geometry = buildWater(low);
  waterMat.defines = low ? { LOW: 1 } : {}; waterMat.needsUpdate = true;
  spray.geometry.instanceCount = low ? 1200 : 4000; sprayMat.uniforms.uNF.value = low ? 900 : 3000;
  spume.geometry.instanceCount = low ? 90 : 220; mist.geometry.instanceCount = low ? 24 : 60; churn.geometry.instanceCount = low ? 48 : 120;
  fallLayers[2].visible = !low;
};
app.update = () => { if (lastLow !== app.state.low) setLow(app.state.low); };
setLow(app.state.low);
sprayMat.uniforms.uNF.value = app.state.low ? 900 : 3000;
app.start();
</script>
