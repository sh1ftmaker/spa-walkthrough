// Prototype (b): Wave Grotto. Slow heated waves over a black-sand beach in a sea cave, ocean beyond the mouth.

  fog: { color: 0x1a2c33, v: [0.0, 0.10, 0.6, 0.004] },
  cams: [
    { pos: [-9, 1.6, -5.5], target: [8, 0.3, 12], fov: 62 },
    { pos: [1.5, 1.4, -6.0], target: [5, -0.2, 3], fov: 55 },

// ------------------------------------------------------------------ the shared wave model
// Linear beach: bed y = -SLOPE*z for z>0 (sea), sand rises for z<0. Deep part depth DD.
const W = { P: 4.8, A: 0.45, SLOPE: 0.12, DD: 4.0, R0: 0.45, TU: 2.3, DRY: 7.0 };
const WAVE_GLSL = /* glsl */`
uniform vec4 uWave;   // P, A deep, slope, deep depth
uniform vec4 uSwash;  // R0, Tu, dry time, -
#define GRAV 9.81
float tArr(float z){                     // shallow-water travel time from the shoreline out to z

  float t = 2.0*sqrt(min(zz, zd))/sqrt(GRAV*s);

float lat(float x){ return x*0.016 + 0.35*(texture(tNoise, vec2(x*0.011, 0.31)).r - 0.5); }  // oblique, wavy crest lines

float swash(float x, float t){

    float R = uSwash.x*(0.6 + 0.8*hash1(nk));
    float u = (tau - uSwash.y)/uSwash.y;

const waveU = { uWave: { value: new THREE.Vector4(W.P, W.A, W.SLOPE, W.DD) }, uSwash: { value: new THREE.Vector4(W.R0, W.TU, W.DRY, 0) } };

    uniform samplerCube tEnv; uniform vec4 uGl[5];

      #include <colorspace_fragment>

  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) {

    const x = -27 + 54 * u; const z = -14 + 72 * Math.pow(v, 1.6);

// ------------------------------------------------------------------ cave: half-tunnel + back wall + stalactites

  const parts = [g];
  for (let i = 0; i < 34; i++) {
    const x = (Math.random() - 0.5) * 36, z = -10 + Math.random() * 60;
    const yTop = Math.sqrt(Math.max(0, 26 * 26 - x * x)) * 0.66 - 3.0;

const cave = new THREE.Mesh(caveGeo, caveMat); scene.add(cave);

// sea stacks outside the mouth (silhouettes)
const stacks = []; for (const [x, z, h, r] of [[-30, 120, 22, 6], [-12, 170, 14, 4], [25, 140, 26, 7], [40, 200, 12, 5], [6, 260, 9, 3]]) {

// ------------------------------------------------------------------ sky + moon (one draw)
const MOON_DIR = new THREE.Vector3(0.1, 0.16, 1).normalize();

  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) { const u = pos.getX(i) + 0.5, v = pos.getZ(i) + 0.5; pos.setXYZ(i, -26 + 52 * u, 0, -5 + 95 * Math.pow(v, 1.7)); }
  g.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 40), 80);
  return g;
}
const water = new THREE.Mesh(buildWater(app.state.low), waterMat); water.renderOrder = 1; water.frustumCulled = false; scene.add(water);
// far ocean beyond the mouth: flat plane, normal map + moon glitter
const farMat = new THREE.ShaderMaterial({
  uniforms: { ...shared, tNormal: { value: app.tex.normal }, uMoon: { value: MOON_DIR } },
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`,
  fragmentShader: GLSL_COMMON + /* glsl */`uniform sampler2D tNormal; uniform vec3 uMoon; varying vec3 vW;
    void main(){
      float dist = length(vW - cameraPosition);
      vec2 nd = (texture(tNormal, vW.xz*0.03 + vec2(0.0, uTime*0.01)).xy*2.0-1.0) + (texture(tNormal, vW.xz*0.011 - vec2(uTime*0.004, 0.0)).xy*2.0-1.0);
      vec3 N = normalize(vec3(nd.x*0.35, 1.0, nd.y*0.35));
      vec3 V = normalize(cameraPosition - vW); vec3 R = reflect(-V, N);
      float F = 0.02 + 0.98*pow(1.0 - max(dot(N,V),0.0), 5.0);
      vec3 skyc = mix(vec3(0.025,0.035,0.06), vec3(0.004,0.006,0.015), pow(max(R.y,0.0), 0.5));
      vec3 col = vec3(0.004,0.02,0.03) + skyc*F + vec3(1.0,0.95,0.85)*pow(max(dot(R, uMoon),0.0), 300.0)*8.0;
      col = mix(col, vec3(0.025,0.035,0.06), smoothstep(200.0, 900.0, dist));
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
});
const far = new THREE.Mesh(new THREE.PlaneGeometry(3000, 1600, 1, 1).rotateX(-Math.PI / 2).translate(0, -0.15, 85 + 800), farMat); scene.add(far);

// ------------------------------------------------------------------ crest spray + low steam, all GPU-driven
const SPRAY_VS = GLSL_COMMON + BILLBOARD_GLSL + WAVE_GLSL + /* glsl */`
attribute float aSeed; uniform vec4 uP; // life, size0, size1, kind
varying float vA; varying vec2 vUv; varying vec3 vW; varying float vSeed;
float zOfT(float tt){ float s = uWave.z; float c = sqrt(GRAV*s)*0.5; return (tt*c)*(tt*c); }   // invert tArr (shallow part)
void main(){
  float life = uP.x; vec3 r = hash31(aSeed*1.73 + 0.2);
  float tt = uTime + r.x*life; float age = mod(tt, life); float cyc = floor(tt/life);
  vec3 r2 = hash31(aSeed*4.31 + cyc*7.7), r3 = hash31(aSeed*2.9 + cyc*3.1 + 5.0);
  float x = mix(-22.0, 22.0, r2.x);
  float t0 = uTime - age;                                         // spawn time
  // which crest is inside the breaking band [zb0, zb1] at spawn time?
  float zb0 = 2.5, zb1 = 10.0 + 3.0*r2.y;
  float ph1 = phaseAt(vec2(x, zb1), t0);
  float n = floor(ph1);
  float tz = (n - lat(x))*uWave.x - t0;                           // tArr(z) of that crest
  float z = zOfT(tz);
  float ok = step(zb0, z)*step(z, zb1);
  vec3 wv = waves(vec2(x, z), t0);
  vec3 p0 = vec3(x, wv.x + 0.05, z);
  float k = uP.w;
  vec3 v0 = k < 0.5 ? vec3((r3.x-0.5)*0.6, mix(1.2, 3.2, r3.y), -mix(1.0, 3.5, r3.z))   // spray thrown shoreward and up
                    : vec3((r3.x-0.5)*0.4, mix(0.3, 0.8, r3.y), -mix(0.8, 2.0, r3.z));  // crest smoke
  vec3 p = p0 + v0*age; p.y -= (k < 0.5 ? 4.9 : 0.15)*age*age;
  float aliveT = age/life;
  vA = ok*wv.y*smoothstep(0.0, 0.1, aliveT)*(1.0 - aliveT)*step(-0.2, p.y - wv.x*0.0 + 0.3);
  float size = mix(uP.y, uP.z, aliveT)*(0.6 + 0.8*r2.z);
  vec3 wp = p + billboard(position.xy, size)*ok;
  vUv = uv; vW = wp; vSeed = aSeed;
  gl_Position = projectionMatrix*viewMatrix*vec4(wp,1.0);
}`;
const PUFF_FS = GLSL_COMMON + /* glsl */`
uniform sampler2D tPuff; uniform vec4 uTint; varying float vA; varying vec2 vUv; varying vec3 vW; varying float vSeed;
void main(){
  vec2 wob = (texture(tNoise, vUv*0.6 + vec2(vSeed*0.137, uTime*0.03)).rg - 0.5)*0.25;
  vec4 t = texture(tPuff, vUv + wob);
  float a = t.a*vA*uTint.a;
  a *= smoothstep(-0.3, 0.4, vW.y);
  a *= smoothstep(1.0, 4.0, distance(vW, cameraPosition));
  float shade = 0.6 + 0.6*texture(tNoise, vUv*0.7 + vec2(vSeed*0.31, 0.0)).r;
  vec3 col = uTint.rgb*t.rgb*shade;
  gl_FragColor = applyFogPM(vec4(col*a, a), vW);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;
function sprayMesh(count, P, tint, order) {
  const m = new THREE.ShaderMaterial({
    uniforms: { ...shared, ...waveU, uP: { value: new THREE.Vector4(...P) }, uTint: { value: new THREE.Vector4(...tint) }, tPuff: { value: app.tex.puff } },
    vertexShader: SPRAY_VS, fragmentShader: PUFF_FS, transparent: true, depthWrite: false,
    blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
  });
  const mesh = new THREE.Mesh(instancedQuads(count), m); mesh.frustumCulled = false; mesh.renderOrder = order; scene.add(mesh); return mesh;
}
const spray = sprayMesh(700, [1.1, 0.35, 1.3, 0], [0.45, 0.62, 0.65, 0.22], 3);
const smoke = sprayMesh(220, [3.0, 1.5, 4.5, 1], [0.32, 0.45, 0.48, 0.12], 4);

// lanterns
const lanternMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.22, 0.34, 0.22), new THREE.MeshBasicMaterial({ color: new THREE.Color(2.4, 1.0, 0.32) }), lanterns.length);
lanterns.forEach((p, i) => lanternMesh.setMatrixAt(i, new THREE.Matrix4().makeTranslation(...p))); scene.add(lanternMesh);

// ------------------------------------------------------------------ probe, groups, tiers
const env = bakeProbe(renderer, scene, new THREE.Vector3(0, 1.2, 4), 128, [water, spray, smoke]);
waterMat.uniforms.tEnv.value = env; sandMat.uniforms.tEnv.value = env;
app.extraTexBytes += 128 * 128 * 6 * 8 * 4 / 3;
app.groups = { rock: [sand, cave, stackMesh, sky, far, lanternMesh], water: [water], particles: [spray, smoke] };
let lastLow = null;
app.update = () => {
  const low = app.state.low; if (low === lastLow) return; lastLow = low;
  sand.geometry.dispose(); sand.geometry = buildSand(low);
  water.geometry.dispose(); water.geometry = buildWater(low);
  waterMat.defines = low ? { LOW: 1 } : {}; waterMat.needsUpdate = true;
  spray.geometry.instanceCount = low ? 350 : 900; smoke.geometry.instanceCount = low ? 90 : 260;
};
app.start();
</script>
