const app = createApp({

  void main(){ vec4 w = modelMatrix*vec4(position,1.); vW = w.xyz; vCol = color; vN = normalize(mat3(modelMatrix)*normal); gl_Position = projectionMatrix*viewMatrix*w; }`;

{ const p = floorGeo.attributes.position; for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i); const r = Math.hypot(x, z); let y = -0.6 * (1 - Math.min(1, Math.max(0, (r - 3.25) / 0.35))); if (x > 6.5 && x < 12.5 && z > -4.5 && z < 0.5) y = -0.8; y += 0.02 * nz(x, 0, z, 2); p.setY(i, y); } }

const serverXZ = t => { const a = t * 0.32; return [Math.cos(a) * 3.1, Math.sin(a) * 3.1 * 0.55 + 0.6]; };

// Glassy and transparent: it refracts the pod behind it (High tier: scene texture), reflects the cave, and lights up

// undulations carried at free-fall speed (material coordinate s = tau - t), so they stretch as the water speeds up.
// Only the last ~12% of the fall breaks into strands and drops (Rayleigh-Plateau), and the gap for the server is

uniform float uR; uniform float uH;
float curtainT(){ return sqrt(2.0*uH/9.81); }
// 1 where the nozzles were closed when this water left the gutter

  vertexShader: GLSL_COMMON + SERVER_GLSL + CURTAIN_GLSL + /* glsl */`varying vec2 vUv; varying float vTau; varying vec3 vW;

    }`,
  fragmentShader: GLSL_COMMON + GLSL_FRAG + SERVER_GLSL + CURTAIN_GLSL + /* glsl */`uniform samplerCube tEnv; uniform vec4 uGl[6]; uniform float uBack;
    varying vec2 vUv; varying float vTau; varying vec3 vW;
    void main(){

      float te = uTime - vTau;
      // the gap, its soft thickened rims
      float g = gapAt(th, te);
      float rim = smoothstep(0.35, 0.55, g)*(1.0 - smoothstep(0.6, 0.72, g));
      // streamwise ripples: smooth, low amplitude, elongated down the sheet
      float u = vUv.x*42.0;
      float h1 = texture(tNoise3, vec3(u*0.11, s*0.45, 0.21)).r;
      float h2 = texture(tNoise3, vec3(u*0.37 + 0.5, s*1.2, 0.63)).g;
      float hx = texture(tNoise3, vec3(u*0.11 + 0.01, s*0.45, 0.21)).r - h1;
      float hx2 = texture(tNoise3, vec3(u*0.37 + 0.51, s*1.2, 0.63)).g - h2;

curtainMat.uniforms.uGl = { value: lanterns.slice(0, 6).map(p => new THREE.Vector4(...p, 1)) };

  const mesh = new THREE.Mesh(geo, m); mesh.renderOrder = 1; scene.add(mesh); return mesh;
}
const ring = flatWater(new THREE.RingGeometry(2.2, 3.4, 64, 1).rotateX(-Math.PI / 2).translate(0, -0.02, 0), [1, 0, 0.25, 0], [0, 0, 0]);
const infinity = flatWater(new THREE.PlaneGeometry(5.9, 3.8).rotateX(-Math.PI / 2).translate(9.5, 0.44, -3.5), [0, 1, 0.12, 4.0], [-1.6, 1, 0]);

// overflow sheet over the lip: thin, glassy, accelerating; breaks into streaks only near the trough
const overflowMat = new THREE.ShaderMaterial({
  uniforms: { ...shared, tEnv: { value: null } },
  vertexShader: /* glsl */`varying vec2 vUv; varying vec3 vW; varying float vTau;
    void main(){ float T = sqrt(2.0*0.75/9.81); float tau = uv.y*T; float x = 9.5 + (uv.x - 0.5)*5.9;
      vec3 p = vec3(x, 0.45 - 0.5*9.81*tau*tau, -1.58 + 0.25*tau);
      vUv = uv; vTau = tau; vW = p; gl_Position = projectionMatrix*viewMatrix*vec4(p,1.0); }`,
  fragmentShader: GLSL_COMMON + /* glsl */`uniform samplerCube tEnv; varying vec2 vUv; varying vec3 vW; varying float vTau;
    void main(){
      float f = vUv.y; float s = vTau - uTime;
      float n = texture(tNoise, vec2(vUv.x*30.0, s*0.5)).r;
      vec3 V = normalize(cameraPosition - vW);
      vec3 N = normalize(vec3((n - 0.5)*0.3, 0.15, 1.0));
      float F = 0.04 + 0.96*pow(1.0 - abs(dot(N, V)), 5.0);
      vec3 env = textureLod(tEnv, reflect(-V, N), 0.5).rgb;
      float streak = smoothstep(0.55, 0.8, n)*smoothstep(0.4, 1.0, f);
      float a = mix(0.22, 0.7, streak) + F*0.4;
      vec3 col = env*F*1.4 + vec3(0.05,0.35,0.33)*0.6 + vec3(0.65,0.85,0.88)*streak*0.6 + vec3(0.6,0.9,0.9)*smoothstep(0.08, 0.0, f)*0.5;
      a *= smoothstep(1.0, 0.92, f);
      gl_FragColor = applyFogPM(vec4(col*a, a), vW);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
  transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
});
const overflowGeo = new THREE.PlaneGeometry(1, 1, 24, 12); { const uv = overflowGeo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setY(i, 1 - uv.getY(i)); }
const overflow = new THREE.Mesh(overflowGeo, overflowMat); overflow.frustumCulled = false; overflow.renderOrder = 3; scene.add(overflow);
const trough = flatWater(new THREE.PlaneGeometry(6.0, 1.0).rotateX(-Math.PI / 2).translate(9.5, -0.35, -1.0), [1, 0, 0.3, 0], [0, 0, 0]);

// Mist Steps sheet: a 1-2 cm film that follows the treads, falls off each nose, and forms a white line where it lands
const stepSheetMat = new THREE.ShaderMaterial({
  uniforms: { ...shared, tNormal: { value: app.tex.normal }, tEnv: { value: null }, uS: { value: new THREE.Vector4(STEP.y0, STEP.rise, STEP.run, STEP.z0) } },
  vertexShader: /* glsl */`uniform vec4 uS; varying vec3 vW; varying float vK; varying float vFall;
    void main(){
      // position.z runs down the flight in "step units": k in [0, n), fractional part = where on the tread
      float k = position.z; float i = floor(k), fk = k - i;
      float z = uS.w - k*uS.z;
      float y = uS.x - i*uS.y + 0.015;
      // last 15% of each tread: the film throws off the nose and drops one riser
      float fall = smoothstep(0.85, 1.0, fk);
      y -= fall*fall*uS.y;
      z -= fall*0.05;
      vec3 p = vec3(position.x, y, z);
      vW = (modelMatrix*vec4(p,1.0)).xyz; vK = k; vFall = fall;
      gl_Position = projectionMatrix*viewMatrix*vec4(vW,1.0);
    }`,
  fragmentShader: GLSL_COMMON + /* glsl */`uniform sampler2D tNormal; uniform samplerCube tEnv; varying vec3 vW; varying float vK; varying float vFall;
    void main(){
      float fk = fract(vK);
      vec2 uv = vec2(vW.x*1.5, vW.z*0.6 + uTime*0.9);
      vec3 nd = texture(tNormal, uv).xyz*2.0-1.0;
      vec3 N = normalize(vec3(nd.x*0.25, 1.0, nd.y*0.25 + vFall*1.5));
      vec3 V = normalize(cameraPosition - vW);
      float F = 0.03 + 0.97*pow(1.0 - max(dot(N, V), 0.0), 5.0);
      vec3 col = textureLod(tEnv, reflect(-V, N), 1.0).rgb*F;
      // white water: a churning line where each drop lands (start of the next tread) and on the nose
      float land = smoothstep(0.18, 0.0, fk)*smoothstep(-0.02, 0.02, fk);
      float lace = 1.0 - texture(tNoise, vec2(vW.x*0.9, vW.z*0.9 + uTime*0.6)).b;
      float foam = smoothstep(0.35, 0.65, lace*(land*1.2 + vFall*0.6) + land*0.3);
      vec3 foamCol = vec3(0.6, 0.8, 0.82)*0.7;
      float a = F + 0.1;
      gl_FragColor = applyFogPM(vec4(col*(1.0-foam) + foamCol*foam, a*(1.0-foam) + foam), vW);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
  transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
});
const stepSheetGeo = new THREE.PlaneGeometry(STEP.x1 - STEP.x0 - 0.1, STEP.n, 8, STEP.n * 14).rotateX(-Math.PI / 2);
{ const p = stepSheetGeo.attributes.position; for (let i = 0; i < p.count; i++) { p.setX(i, p.getX(i) + (STEP.x0 + STEP.x1) / 2); p.setZ(i, Math.min(STEP.n - 0.001, p.getZ(i) + STEP.n / 2)); } }
const stepSheet = new THREE.Mesh(stepSheetGeo, stepSheetMat); stepSheet.frustumCulled = false; stepSheet.renderOrder = 2; scene.add(stepSheet);

// low mist sprites drifting over all of it (one draw)
const mistMat = new THREE.ShaderMaterial({
  uniforms: { ...shared, tPuff: { value: app.tex.puff } },
  vertexShader: GLSL_COMMON + BILLBOARD_GLSL + /* glsl */`attribute float aSeed; varying float vA; varying vec2 vUv; varying vec3 vW;
    void main(){ vec3 r = hash31(aSeed*1.7 + 0.2); float life = 9.0; float tt = uTime + r.x*life; float age = mod(tt, life)/life; float cyc = floor(tt/life);
      vec3 r2 = hash31(aSeed*3.3 + cyc*5.1);
      vec3 p = vec3(mix(-9.0, 13.0, r2.x), 0.25 + 0.5*age, mix(-7.0, 4.0, r2.y)) + vec3(age*1.2, 0.0, age*0.4);
      vA = sin(age*3.14159); float size = mix(1.5, 3.5, r2.z);
      vec3 wp = p + billboard(position.xy, size); vUv = uv; vW = wp; gl_Position = projectionMatrix*viewMatrix*vec4(wp,1.0); }`,
  fragmentShader: GLSL_COMMON + /* glsl */`uniform sampler2D tPuff; varying float vA; varying vec2 vUv; varying vec3 vW;
    void main(){ float w = texture(tNoise, vUv*vec2(0.8,0.4) + vW.xz*0.05 + uTime*0.02).r; float a = texture(tPuff, vUv).a*vA*0.05*smoothstep(0.3, 0.7, w + 0.15);
      a *= smoothstep(1.0, 3.5, distance(vW, cameraPosition));
      gl_FragColor = applyFogPM(vec4(vec3(0.55,0.68,0.7)*a, a), vW);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
  transparent: true, depthWrite: false, blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
});
const mist = new THREE.Mesh(instancedQuads(40), mistMat); mist.frustumCulled = false; mist.renderOrder = 6; scene.add(mist);

// ------------------------------------------------------------------ probe, groups, tiers, animation
const fx = [curtain, curtainBack, curtainDrops, landRing, ring, infinity, overflow, trough, stepSheet, mist, server];
const env = bakeProbe(renderer, scene, new THREE.Vector3(1, 1.4, 4), 128, fx);
for (const m of [curtain, ring, infinity, overflow, trough, stepSheet]) m.material.uniforms.tEnv.value = env;
app.extraTexBytes += 128 * 128 * 6 * 8 * 4 / 3;
app.setLights([
  ...lanterns.map((p, i) => ({ pos: new THREE.Vector3(...p), color: WARM, i: i === 0 ? 2.0 : 1.6, falloff: 0.4 })),
  { pos: new THREE.Vector3(0, -0.5, 2.8), color: TEAL, i: 1.0, falloff: 0.3 },
], new THREE.Color(0.02, 0.04, 0.04));
app.sceneTexture = true; app.fx(...fx.filter(m => m !== server));
app.groups = { rock: [floor, channelFloor, pod, roof, poolRim, poolBack, stairs, lanternMesh, server], curtain: [curtain, curtainBack, curtainDrops, landRing], sheets: [ring, infinity, overflow, trough, stepSheet], mist: [mist] };
let lastLow = null;
app.update = (t) => {
  const [x, z] = serverXZ(t); server.position.set(x, 0.85, z);
  curtainDrops.material.uniforms.uPix.value = 2 * Math.tan(app.camera.fov * Math.PI / 360) / Math.max(1, renderer.domElement.height);
  if (lastLow === app.state.low) return; lastLow = app.state.low;
  curtain.geometry.dispose(); curtain.geometry = curtainGeo(lastLow); curtainBack.geometry = curtain.geometry;
  mist.geometry.instanceCount = lastLow ? 16 : 40; curtainDrops.geometry.instanceCount = lastLow ? 2000 : 6000;
};
app.start();
</script>
