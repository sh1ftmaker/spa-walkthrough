<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Kazan-yu Sound Renders</title>
<meta name="description" content="Offline renders of the Kazan-yu soundscape prototype, with spectrograms and loudness.">
<style>
:root{--bg:#0d0f12;--panel:#161a1f;--line:#2a3038;--fg:#e6e2da;--dim:#8d929a;--accent:#4fd1c5}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f4f1ea;--panel:#fffdf8;--line:#d9d3c7;--fg:#1d1f22;--dim:#6b6f75;--accent:#0f8c80}}
:root[data-theme="dark"]{--bg:#0d0f12;--panel:#161a1f;--line:#2a3038;--fg:#e6e2da;--dim:#8d929a;--accent:#4fd1c5}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:19px;margin:6px 0}p{color:var(--dim);margin:4px 0 14px}
a{color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.card h2{font-size:15px;margin:0 0 4px}.meta{color:var(--dim);font-size:12px;margin-bottom:6px}
audio{width:100%;margin:4px 0}img{width:100%;height:auto;border-radius:6px;display:block}
</style>
</head>
<body><main>
<h1>Kazan-yu · offline sound renders</h1>
<p>25-second walks rendered by the same engine as the <a href="../demo/">live demo</a>, in an OfflineAudioContext. Headphones recommended. Loudness is ITU-R BS.1770 integrated (LUFS-I).</p>
<div id="list"></div>
</main>
<script type="module">
const SC = (await import('../demo/js/scenarios.js')).SCENARIOS;
let rep = {}; try { rep = await (await fetch('./preview_report.json')).json(); } catch (_) {}
const list = document.getElementById('list');
for (const [id, sc] of Object.entries(SC)) {
  const r = rep[id] || {}; const d = document.createElement('div'); d.className = 'card';
  d.innerHTML = `<h2>${sc.title}</h2><div class="meta">${id} · ${r.lufs_i ?? '?'} LUFS-I · short-term max ${r.lufs_st_max ?? '?'} · true peak ${r.true_peak_dbtp ?? '?'} dBTP</div>
  <audio controls preload="none"><source src="./${id}.opus" type="audio/ogg; codecs=opus"><source src="./${id}.m4a" type="audio/mp4"></audio>
  <img loading="lazy" alt="Spectrogram of ${sc.title}" src="../../../renders/sound/spec_${id}.jpg">`;
  list.appendChild(d);
}
</script>
</body></html>
